services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voxr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: voxr_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxr -d voxr_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/bin/voxr", "eval", "Voxr.Release.migrate()"]
    environment:
      DATABASE_URL: "ecto://voxr:${POSTGRES_PASSWORD}@postgres/voxr_prod"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PHX_SERVER: "true"
      DATABASE_URL: "ecto://voxr:${POSTGRES_PASSWORD}@postgres/voxr_prod"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:-localhost}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
